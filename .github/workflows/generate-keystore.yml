# Run this workflow ONCE to generate your signing keystore.
# After running, copy the 4 output values and save them as GitHub Secrets.
# Then you can delete or disable this workflow.
#
# How to run:
#   Go to Actions tab → "Generate Signing Keystore" → Run workflow

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. alterinstaller)'
        required: true
        default: 'alterinstaller'
      keystore_password:
        description: 'Keystore password (save this — you will need it as a secret)'
        required: true
      key_password:
        description: 'Key password (can be same as keystore password)'
        required: true
      validity_years:
        description: 'Certificate validity in years'
        required: true
        default: '25'

jobs:
  generate:
    name: Generate Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 4096 \
            -validity $(( ${{ github.event.inputs.validity_years }} * 365 )) \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=AlterInstaller, O=Android, C=US" \
            -storetype pkcs12

      - name: Output base64 keystore
        run: |
          echo "============================================================"
          echo "Copy the values below and add them as GitHub Repository Secrets"
          echo "(Settings → Secrets and variables → Actions → New repository secret)"
          echo "============================================================"
          echo ""
          echo "Secret name : KEYSTORE_BASE64"
          echo "Secret value:"
          base64 -w 0 release.keystore
          echo ""
          echo ""
          echo "Secret name : KEYSTORE_PASSWORD"
          echo "Secret value: ${{ github.event.inputs.keystore_password }}"
          echo ""
          echo "Secret name : KEY_ALIAS"
          echo "Secret value: ${{ github.event.inputs.key_alias }}"
          echo ""
          echo "Secret name : KEY_PASSWORD"
          echo "Secret value: ${{ github.event.inputs.key_password }}"
          echo ""
          echo "============================================================"
          echo "IMPORTANT: Delete or disable this workflow after saving the secrets!"
          echo "============================================================"
